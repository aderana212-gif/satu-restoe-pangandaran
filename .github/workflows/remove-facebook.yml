name: Remove Facebook Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Facebook button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = re.sub(r'<a\b[^>]*>Facebook</a>', '', s, flags=re.I)
          if new != s:
              p.write_text(new, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Facebook button already removed"
          else
            git add index.html
            git commit -m "Remove Facebook button"
            git push
          fi
