<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing By WhatsApp — Satu Restoe</title><style>body{margin:0;background:#eef3f8;font-family:Arial;color:#172033}header{background:#0b3a75;color:#fff;padding:18px}h1{margin:0;font-size:21px}main{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f2f6fa;padding:10px;border-radius:9px}.stat b{display:block;font-size:20px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4df;border-radius:8px;margin:4px 0 8px;font-size:14px}textarea{min-height:210px}button{padding:10px 12px;border:0;border-radius:8px;font-weight:bold;margin:3px}.blue{background:#0b3a75;color:#fff}.green{background:#25d366;color:#fff}.gray{background:#e7edf4}.red{background:#c62828;color:#fff}.table{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f3f5f8;position:sticky;top:0}tr.selected,tr:hover{background:#eaf3ff}.notice{background:#edf7ee;padding:9px;border-left:4px solid #28a745;border-radius:7px;font-size:12px}</style></head><body><header><h1>MARKETING BY WHATSAPP — SATU RESTOE</h1><div>Database Travel • Pesan Marketing • WhatsApp Business</div></header><main><div class="card"><div class="stats"><div class="stat">Total<b id="total">166</b></div><div class="stat">Belum Dihubungi<b id="new">166</b></div><div class="stat">Follow Up<b id="follow">0</b></div><div class="stat">Respon/Deal<b id="resp">0</b></div></div></div><div class="grid"><section class="card"><h3>Database Customer</h3><div class="notice"><b>166 calon customer</b> sudah tertanam di aplikasi.</div><button class="blue" onclick="newCustomer()">＋ Tambah Customer</button><button class="gray" onclick="exportCSV()">Export CSV</button><input id="search" placeholder="Cari travel, kota, WA..." oninput="render()"><select id="provFilter" onchange="render()"><option value="">Semua Provinsi</option><option>Jawa Barat</option><option>Jawa Tengah</option></select><select id="prioFilter" onchange="render()"><option value="">Semua Prioritas</option><option>A</option><option>B</option></select><select id="statusFilter" onchange="render()"><option value="">Semua Status</option><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><div class="table"><table><thead><tr><th>No</th><th>P</th><th>Travel</th><th>Kota</th><th>WA</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card"><h3 id="title">Pilih Customer</h3><label>Nama Travel</label><input id="name"><label>Provinsi</label><input id="prov"><label>Kota / Area</label><input id="city"><label>WhatsApp</label><input id="phone"><label>Prioritas</label><select id="prio"><option>A</option><option>B</option></select><label>Status</label><select id="status"><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><label>Pesan Marketing</label><textarea id="message"></textarea><button class="blue" onclick="save()">💾 Simpan</button><button class="gray" onclick="copyMsg()">📋 Copy Pesan</button><button class="green" onclick="openWA()">💚 WA Business</button><button class="gray" onclick="copyLink()">🔗 Copy Link</button><button class="red" onclick="del()">Hapus</button><label>Catatan</label><textarea id="notes" style="min-height:70px"></textarea></section></div></main><script src="data.js"></script><script>let data=SEED.map(x=>({prio:x[0],prov:x[1],city:x[2],name:x[3],phone:x[4],status:'Belum dihubungi',notes:''})),selected=-1;const msgTemplate=`Assalamu'alaikum Bapak/Ibu [NAMA TRAVEL] 🙏\n\nPerkenalkan, kami dari *Satu Restoe Pangandaran*.\n\nKami ingin menawarkan kerja sama untuk kebutuhan *makan rombongan wisata* yang berkunjung ke Pangandaran. 🍽️🌴\n\nKami menyiapkan *menu khusus rombongan dengan harga yang bersahabat untuk travel*, sehingga perjalanan tamu lebih nyaman dan praktis.\n\nApabila Bapak/Ibu berkenan, kami siap kirimkan *brosur menu & harga* untuk dipertimbangkan sebagai salah satu pilihan tempat makan rombongan.\n\nApakah Bapak/Ibu saat ini memiliki rombongan atau itinerary ke Pangandaran?\n\nTerima kasih 🙏\n*SATU RESTOE PANGANDARAN*`;$('message').value=msgTemplate;function $(i){return document.getElementById(i)}function msg(x){return msgTemplate.replaceAll('[NAMA TRAVEL]',x?.name||'').replaceAll('[KOTA]',x?.city||'')}function pick(i){selected=i;let x=data[i];$('name').value=x.name;$('prov').value=x.prov;$('city').value=x.city;$('phone').value=x.phone;$('prio').value=x.prio;$('status').value=x.status;$('notes').value=x.notes||'';$('message').value=msg(x);$('title').textContent='Customer #'+(i+1);render()}function newCustomer(){selected=-1;$('title').textContent='Customer Baru';['name','prov','city','phone','notes'].forEach(i=>$(i).value='');$('prio').value='A';$('status').value='Belum dihubungi';$('message').value=msgTemplate}function save(){let x={name:$('name').value.trim(),prov:$('prov').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim(),prio:$('prio').value,status:$('status').value,notes:$('notes').value.trim()};if(!x.name)return alert('Nama travel wajib diisi');if(selected<0){data.push(x);selected=data.length-1}else data[selected]=x;render();alert('Customer tersimpan')}function del(){if(selected<0)return;if(confirm('Hapus customer ini?')){data.splice(selected,1);selected=-1;render();newCustomer()}}function waLink(){let p=$('phone').value.replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);return p?'https://wa.me/'+p+'?text='+encodeURIComponent($('message').value):''}function openWA(){let l=waLink();if(!l)return alert('Nomor WhatsApp belum diisi');window.location.href=l;if(selected>=0){data[selected].status='Sudah dihubungi';$('status').value='Sudah dihubungi';render()}}async function copyLink(){let l=waLink();if(!l)return alert('Nomor WhatsApp belum diisi');try{await navigator.clipboard.writeText(l);alert('Link berhasil dicopy')}catch(e){prompt('Copy link ini:',l)}}async function copyMsg(){try{await navigator.clipboard.writeText($('message').value);alert('Pesan berhasil dicopy')}catch(e){prompt('Copy pesan:',$('message').value)}}function render(){let q=$('search').value.toLowerCase(),pf=$('provFilter').value,pr=$('prioFilter').value,sf=$('statusFilter').value,t='';data.forEach((x,i)=>{let ok=(!q||[x.name,x.city,x.phone,x.prov].join(' ').toLowerCase().includes(q))&&(!pf||x.prov===pf)&&(!pr||x.prio===pr)&&(!sf||x.status===sf);if(ok)t+=`<tr class="${i===selected?'selected':''}" onclick="pick(${i})"><td>${i+1}</td><td>${x.prio}</td><td>${x.name}</td><td>${x.city}</td><td>${x.phone||'-'}</td><td>${x.status}</td></tr>`});$('tbody').innerHTML=t;$('total').textContent=data.length;$('new').textContent=data.filter(x=>x.status==='Belum dihubungi').length;$('follow').textContent=data.filter(x=>x.status==='Follow Up').length;$('resp').textContent=data.filter(x=>x.status==='Respon'||x.status==='Deal').length}function exportCSV(){let h='No,Prioritas,Provinsi,Kota,Nama Travel,WhatsApp,Status,Catatan\n',b=data.map((x,i)=>[i+1,x.prio,x.prov,x.city,x.name,x.phone,x.status,x.notes].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+b],{type:'text/csv'}));a.download='Satu_Restoe_166_Customer.csv';a.click()}render()</script></body></html>
